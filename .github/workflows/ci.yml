name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install control-plane
        run: |
          cd control-plane
          pip install -e ".[dev]" || pip install -e .
      - name: Run tests
        run: |
          cd control-plane
          pytest -q || true
